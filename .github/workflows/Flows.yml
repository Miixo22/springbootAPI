name: Build, Test, and Deploy

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: miixo22/springbootapi-app
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: taskdb

jobs:
  # 1️⃣ Build and Push on GitHub-hosted runner
  build_and_push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and test with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/$POSTGRES_DB
          SPRING_DATASOURCE_USERNAME: $POSTGRES_USER
          SPRING_DATASOURCE_PASSWORD: $POSTGRES_PASSWORD
        run: |
          mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest


  # 2️⃣ Deploy on Ubuntu VM (self-hosted runner)
  deploy:
    needs: build_and_push
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Kubernetes (kind)
        run: |
          kind delete cluster --name springboot || true
          kind create cluster --name springboot
          kubectl cluster-info --context kind-springboot --insecure-skip-tls-verify

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Write inventory
        run: |
          mkdir -p ansible/hosts
          cat > ansible/hosts/k8s.yml <<'EOF'
          all:
            children:
              api_servers:
                hosts:
                  localhost:
                    ansible_connection: local
          EOF

      - name: Run Ansible K8s deployment
        env:
          INSECURE_SKIP_TLS_VERIFY: "true"
        run: ansible-playbook -i ansible/hosts/k8s.yml ansible/playbooks/k8s-deploy.yml
